services:
  auth-server:
    image: "iconcommunity/icon-wallet-auth-backend-app:1.0.2"
    container_name: auth-server
    ports:
      - "3005:3005"
    networks:
      - mynetworkprod
    environment:
      - NODE_ENV=production
      - JWT_SECRET="VERY SECRET SECRET TO BE CHANGED IN PRODUCTION 98237492"
      - JWT_EXPIRES_IN_S=604800
      - CHALLENGE_EXPIRATION_TIME_MS=180000
      - AUTH_TTL=60000
      - AUTH_LIMIT=300
      - CORS_ENABLED=true
      - PORT=3005
  mongodb-prod:
    image: mongo:latest
    container_name: mongodb-prod
    ports:
      - "27017:27017"
    networks:
      - mynetworkprod
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    # This is the volume that will be used to persist
    # the data while running in prod
    volumes:
      - ./db/data:/data/db

  blockchain-scraper:
    build:
      context: ./db-manager
    container_name: blockchain-scraper
    depends_on:
      - mongodb-prod
      - rest-server
    networks:
      - mynetworkprod
    command: ["node", "blockchain-scraper.js"]
    environment:
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      MONGO_CONTAINER: mongodb-prod

  rest-server:
    container_name: rest-server
    build:
      context: ./nestjs-rest-server
    restart: always
    ports:
      - "3500:3500"
    depends_on:
      - mongodb-prod
      - auth-server
    networks:
      - mynetworkprod
    environment:
      NODE_ENV: prod
      LOG_LEVEL: debug
      PORT: 3500
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      MONGO_CONTAINER: mongodb-prod
      ICON_NETWORK: mainnet
      AUTH_URL: http://auth-server:3005

networks:
  mynetworkprod:
    driver: bridge
